<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Phaze Machine Reservation{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/phaze-theme.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
  <div class="phz-topbar">
    <a class="phz-brand" href="/"><span class="mark"></span> Phaze Reservations</a>
    <nav class="phz-nav">
      <a href="/" class="{{ 'active' if active == 'book' else '' }}">Book a machine</a>
      <a href="/admin" class="{{ 'active' if active == 'admin' else '' }}">Admin</a>
    </nav>
  </div>

  <main class="phz-main{% block main_class %}{% endblock %}">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="phz-flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
